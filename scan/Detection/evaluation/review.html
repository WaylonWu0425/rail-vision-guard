<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>视界巡警 · 现场样本复核</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f4f9;color:#16304c;font:14px 'Microsoft YaHei',sans-serif}button,select,input{font:inherit}button,select{cursor:pointer}button{border:1px solid #c8d6e7;border-radius:6px;background:white;color:#16304c;padding:9px 13px}button:hover{background:#eaf2ff}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #79a8fa}.primary{background:#196bda;color:white}.primary:hover{background:#115bbd}header{height:72px;background:white;border-bottom:1px solid #d8e2ef;padding:12px 22px;display:flex;align-items:center;justify-content:space-between}h1{font-size:19px;margin:0 0 5px}small,.muted{color:#52667e}main{display:grid;grid-template-columns:250px minmax(0,1fr) 290px;height:calc(100vh - 72px)}nav,aside{background:white;overflow:auto;padding:16px}nav{border-right:1px solid #d8e2ef}aside{border-left:1px solid #d8e2ef}.sample{width:100%;text-align:left;display:block;margin:8px 0;overflow-wrap:anywhere}.sample.active{border-color:#196bda;background:#eaf2ff}.sample small{display:block;margin-top:5px}.workspace{min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px;gap:12px}.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.viewport{flex:1;min-height:0;overflow:auto;background:#172a3d;border-radius:8px;position:relative}canvas{display:block;touch-action:none;cursor:crosshair}label{display:block;margin:14px 0;line-height:1.7}input[type=checkbox]{width:16px;height:16px;vertical-align:middle}aside button{margin:5px 0}.list{max-height:190px;overflow:auto}.list button{display:block;width:100%;font-size:12px;text-align:left}.notice{background:#eef5ff;border:1px solid #ccdcf7;padding:12px;border-radius:7px;line-height:1.8}#status{font-weight:600;min-height:22px}#source{overflow-wrap:anywhere;line-height:1.8}h2{font-size:15px;margin-top:22px}.coords{display:grid;grid-template-columns:1fr 1fr;gap:6px}.coords label{margin:3px 0}.coords input{width:100%;padding:5px;border:1px solid #bccfe5}#error{color:#b42318}footer{line-height:1.8}
</style>
<header><div><h1>现场样本复核工作台</h1><small>版本 R4 · 本机处理 · 人工复核后才参与评测</small></div><div id="status" role="status" aria-live="polite">正在读取样本…</div></header>
<div id="leave" hidden role="region" aria-label="未保存修改" style="position:fixed;top:76px;left:270px;right:310px;z-index:10;padding:14px;background:#fff7e6;border:1px solid #d89b2b;border-radius:8px;box-shadow:0 4px 18px #142d4933"><strong>当前修改尚未保存。</strong>请选择：<button id="saveLeave">保存修改后切换</button> <button id="discardLeave">放弃修改并切换</button> <button id="cancelLeave">继续编辑</button></div>
<noscript>工作台需要启用JavaScript，请使用系统浏览器打开本机地址。</noscript>
<main><nav><label>样本范围<select id="filter"><option value="priority">首批10张</option><option value="all">全部样本</option></select></label><div id="samples"></div></nav>
<section class="workspace"><div class="tools"><button id="prev">上一张</button><button id="next">下一张</button><label style="margin:0">工具 <select id="mode"><option value="person">画人员框</option><option value="ignore">画忽略区域</option><option value="edit">选择 / 移动 / 调整</option></select></label><button id="add">新增框（坐标编辑）</button><button id="fit">适应窗口</button><button id="minus" aria-label="缩小图片">−</button><span id="zoom"></span><button id="plus" aria-label="放大图片">＋</button><button id="delete">删除选中框</button></div><div class="viewport" id="viewport"><canvas id="canvas" aria-label="原图标注画布；也可用右侧坐标输入修改选中框"></canvas></div><footer class="muted">拖动绘制框；编辑模式拖动框移动，拖动四角缩放。放大后使用滚动条查看原图。框列表可键盘选择，坐标可精确修改。<span id="error" role="alert"></span></footer></section>
<aside><div class="notice">绿色：人员框；橙色：忽略区域。小尺寸、蹲姿、遮挡人员请仔细检查。预标注不是真值，人员出现也不等于违规。</div><h2>当前来源</h2><div id="source"></div><h2>框与区域</h2><div id="boxes" class="list"></div><div class="coords" id="coords"></div><button id="apply">应用坐标修改</button><label><input type="checkbox" id="empty"> 确认此图没有可评价人员</label><label><input type="checkbox" id="reviewed"> 已逐项人工复核，可用于评测</label><button id="draft">保存草稿</button> <button class="primary" id="save">保存复核结果</button><p class="muted">改框后自动取消“已复核”；切图前有未保存修改会提示。严重遮挡无法可靠定位的区域可设为忽略；不要用忽略区隐藏模型误检。</p></aside></main>
<script>
let token='__TOKEN__';
const $=id=>document.getElementById(id), canvas=$('canvas'),ctx=canvas.getContext('2d');
let manifest,entries=[],current=null,annotation={boxes:[],ignore:[],empty:false,reviewed:false},img=new Image(),scale=1,selected=null,drag=null,dirty=false,busy=false,pendingLeave=null;
function setBusy(value){busy=value;document.querySelectorAll('button,select,input').forEach(e=>e.disabled=value)}
function askToLeave(action){pendingLeave=action;$('leave').hidden=false;status('请选择保存、放弃修改或继续编辑');$('cancelLeave').focus()}
function closeLeave(){const action=pendingLeave;pendingLeave=null;$('leave').hidden=true;return action}
$('cancelLeave').onclick=()=>{closeLeave();status('继续编辑，修改尚未保存')};
$('discardLeave').onclick=()=>{const action=closeLeave();if(action)action()};
$('saveLeave').onclick=async()=>{if(await save(false)){const action=closeLeave();if(action)action()}};
async function api(url,options={},retry=true){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(url,{...options,signal:controller.signal});if(!r.ok){const raw=await r.text();let body={};try{body=JSON.parse(raw)}catch{}if(r.status===403&&body.code==='token_expired'&&retry){status('服务会话已更新，正在恢复保存…');const session=await api('/session',{},false);token=session.token;return await api(url,{...options,headers:{...options.headers,'X-Review-Token':token}},false)}throw Error(body.error||(r.status===403?'保存被拒绝，请保留当前标注并重新打开本机工作台；不要重复绘制':'请求失败（HTTP '+r.status+'）'))}return await r.json()}catch(e){if(e.name==='AbortError')throw Error('请求超时，请重试；未保存修改仍保留在当前页面');throw e}finally{clearTimeout(timer)}}
function status(t,error=false){$('status').textContent=t;$('status').style.color=error?'#b42318':'#196bda'}
function mark(){dirty=true;annotation.reviewed=false;$('reviewed').checked=false;status('有未保存修改')}
function list(){const target=$('boxes');target.replaceChildren();for(const kind of ['boxes','ignore'])annotation[kind].forEach((box,i)=>{const b=document.createElement('button');b.textContent=`${kind==='boxes'?'人员':'忽略区'} ${i+1} · ${box.map(Math.round).join(', ')}`;b.onclick=()=>{selected={kind,i};draw();coordinates()};target.append(b)});}
function coordinates(){const el=$('coords');el.replaceChildren();if(!selected)return;const b=annotation[selected.kind][selected.i];['x1','y1','x2','y2'].forEach((name,i)=>{const label=document.createElement('label');label.textContent=name;const input=document.createElement('input');input.type='number';input.id='coord'+i;input.value=Math.round(b[i]);label.append(input);el.append(label)})}
function draw(){if(!img.naturalWidth)return;canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);ctx.drawImage(img,0,0,canvas.width,canvas.height);ctx.lineWidth=2;for(const kind of ['boxes','ignore'])annotation[kind].forEach((b,i)=>{ctx.strokeStyle=kind==='boxes'?'#29f0a0':'#ffb347';ctx.fillStyle=ctx.strokeStyle;ctx.strokeRect(b[0]*scale,b[1]*scale,(b[2]-b[0])*scale,(b[3]-b[1])*scale);ctx.font='13px sans-serif';ctx.fillText(`${kind==='boxes'?'P':'I'}${i+1}`,b[0]*scale+3,b[1]*scale+15);if(selected?.kind===kind&&selected.i===i)for(const [x,y] of [[b[0],b[1]],[b[2],b[1]],[b[0],b[3]],[b[2],b[3]]])ctx.fillRect(x*scale-4,y*scale-4,8,8)});$('zoom').textContent=Math.round(scale*100)+'%';}
function fit(){scale=Math.min(($('viewport').clientWidth-4)/img.naturalWidth,($('viewport').clientHeight-4)/img.naturalHeight);draw()}
function refreshNav(){const el=$('samples');el.replaceChildren();entries.forEach((e,i)=>{const b=document.createElement('button');b.className='sample'+(current?.id===e.id?' active':'');const title=document.createElement('span');title.textContent=`${i+1}. ${e.id}`;const small=document.createElement('small');small.textContent=`${e.split==='test'?'锁定测试组':'调参组'} · ${e.group}`;b.append(title,small);b.onclick=()=>load(e);el.append(b)})}
async function load(e,skipGuard=false){if(busy){status('正在加载，请稍候…');return}if(dirty&&!skipGuard){askToLeave(()=>load(e,true));return}setBusy(true);status('正在加载图片…');let timer;try{const a=await api('/annotation/'+e.id);const nextImg=new Image();nextImg.src='/image/'+e.id;await Promise.race([nextImg.decode(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('图片加载超时，请重试切换')),20000)})]);annotation=a;img=nextImg;current=e;selected=null;drag=null;dirty=false;$('empty').checked=a.empty;$('reviewed').checked=a.reviewed;$('source').textContent=`${e.source}\n机位组：${e.group}；时间点：${e.seconds??'照片'}；尺寸：${e.width}×${e.height}`;list();coordinates();refreshNav();fit();status(a.reviewed?'已人工复核':'待人工复核')}catch(e){status(e.message,true)}finally{clearTimeout(timer);setBusy(false)}}
function point(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(img.naturalWidth,(e.clientX-r.left)/scale)),Math.max(0,Math.min(img.naturalHeight,(e.clientY-r.top)/scale))]}
canvas.onpointerdown=e=>{if(!current)return;const p=point(e);canvas.setPointerCapture(e.pointerId);if($('mode').value==='edit'){selected=null;for(const kind of ['ignore','boxes'])for(let i=annotation[kind].length-1;i>=0;i--){const b=annotation[kind][i];const corners=[[0,1],[2,1],[0,3],[2,3]];const corner=corners.find(([x,y])=>Math.hypot((p[0]-b[x])*scale,(p[1]-b[y])*scale)<10);if(corner||(p[0]>=b[0]&&p[0]<=b[2]&&p[1]>=b[1]&&p[1]<=b[3])){selected={kind,i};drag={start:p,old:[...b],corner};coordinates();draw();return}}draw();coordinates();return}const kind=$('mode').value==='person'?'boxes':'ignore';annotation[kind].push([...p,...p]);selected={kind,i:annotation[kind].length-1};drag={start:p,new:true};};
canvas.onpointermove=e=>{if(!drag||!selected)return;const p=point(e),b=annotation[selected.kind][selected.i],s=drag.start;if(drag.new){b.splice(0,4,Math.min(s[0],p[0]),Math.min(s[1],p[1]),Math.max(s[0],p[0]),Math.max(s[1],p[1]))}else if(drag.corner){const [x,y]=drag.corner;b[x]=p[0];b[y]=p[1]}else{const o=drag.old,dx=Math.max(-o[0],Math.min(img.naturalWidth-o[2],p[0]-s[0])),dy=Math.max(-o[1],Math.min(img.naturalHeight-o[3],p[1]-s[1]));b.splice(0,4,o[0]+dx,o[1]+dy,o[2]+dx,o[3]+dy)}mark();draw()};
function finish(){if(!drag||!selected)return;const b=annotation[selected.kind][selected.i];const [x1,y1,x2,y2]=b;b.splice(0,4,Math.min(x1,x2),Math.min(y1,y2),Math.max(x1,x2),Math.max(y1,y2));if(b[2]-b[0]<1||b[3]-b[1]<1){annotation[selected.kind].splice(selected.i,1);selected=null}drag=null;mark();list();coordinates();draw()}
canvas.onpointerup=finish;canvas.onpointercancel=finish;
$('delete').onclick=()=>{if(selected){annotation[selected.kind].splice(selected.i,1);selected=null;mark();list();coordinates();draw()}};
$('add').onclick=()=>{if(!current)return;const kind=$('mode').value==='ignore'?'ignore':'boxes';annotation[kind].push([0,0,Math.min(100,img.naturalWidth),Math.min(100,img.naturalHeight)]);selected={kind,i:annotation[kind].length-1};mark();list();coordinates();draw();$('coord0').focus()};
$('apply').onclick=()=>{if(!selected)return;const b=[0,1,2,3].map(i=>Number($('coord'+i).value));if(!b.every(Number.isFinite)||b[0]<0||b[1]<0||b[2]>img.naturalWidth||b[3]>img.naturalHeight||b[2]<=b[0]||b[3]<=b[1])return status('坐标必须在图内，右下角必须大于左上角',true);annotation[selected.kind][selected.i]=b;mark();list();draw()};
$('empty').onchange=()=>{mark();annotation.empty=$('empty').checked};$('reviewed').onchange=()=>{dirty=true;annotation.reviewed=$('reviewed').checked;status('有未保存修改')};
async function save(draft){if(!current||busy){status('请等待图片载入或当前操作完成');return false}setBusy(true);annotation.empty=$('empty').checked;annotation.reviewed=draft?false:$('reviewed').checked;status('正在保存…');try{const r=await api('/annotation/'+current.id,{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(annotation)});dirty=false;$('reviewed').checked=r.reviewed;status(r.reviewed?'已保存人工复核结果':'已保存草稿（不计入评测）');return true}catch(e){status(e.message,true);return false}finally{setBusy(false)}}
$('save').onclick=()=>save(false);$('draft').onclick=()=>save(true);$('fit').onclick=fit;$('plus').onclick=()=>{scale=Math.min(4,scale*1.25);draw()};$('minus').onclick=()=>{scale=Math.max(.1,scale/1.25);draw()};
function move(n){const i=entries.findIndex(e=>e.id===current?.id);if(entries[i+n])load(entries[i+n])}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('filter').onchange=()=>{const value=$('filter').value,previous=entries.length===manifest.entries.length?'all':'priority';const apply=()=>{$('filter').value=value;entries=manifest.entries.filter(e=>value==='all'||e.priority);refreshNav();if(entries.length)load(entries[0],true)};if(dirty){$('filter').value=previous;askToLeave(apply)}else apply()};
window.addEventListener('error',e=>status('页面交互异常：'+e.message+'。请保留当前页面并反馈此提示。',true));
window.addEventListener('unhandledrejection',e=>status('操作失败：'+(e.reason?.message||String(e.reason)),true));
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
api('/manifest').then(m=>{manifest=m;entries=m.entries.filter(e=>e.priority);refreshNav();if(entries.length)load(entries[0]);else status('没有样本',true)}).catch(e=>status(e.message,true));
</script></html>
