<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视界巡警 · 检测错误诊断</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#19324d;font:14px 'Microsoft YaHei',sans-serif}header{background:white;border-bottom:1px solid #d6e1ee;padding:16px 24px}h1{margin:0;font-size:22px}p{line-height:1.8}small,.muted{color:#53677e}main{display:grid;grid-template-columns:245px minmax(0,1fr);height:calc(100vh - 94px)}nav{background:white;overflow:auto;padding:14px;border-right:1px solid #d6e1ee}section{overflow:auto;padding:18px;min-width:0}button,select{font:inherit;border:1px solid #c7d6e7;border-radius:6px;background:white;color:#19324d;padding:8px;cursor:pointer}button:hover{background:#eaf2ff}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #6699e4}.case{display:block;width:100%;text-align:left;margin:7px 0;overflow-wrap:anywhere}.case.active{border-color:#176bd7;background:#eaf2ff}.case small{display:block;margin-top:5px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.notice{background:#edf4ff;border:1px solid #cdddf2;padding:12px;border-radius:8px;margin:12px 0;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.panel{background:white;border:1px solid #d4dfeb;border-radius:8px;overflow:hidden;min-width:0}.panel h2{font-size:15px;margin:0;padding:12px;border-bottom:1px solid #e1e8f1}.panel canvas{width:100%;display:block;background:#14293c}.panel p{margin:0;padding:10px;min-height:48px}.details{background:white;border:1px solid #d4dfeb;border-radius:8px;padding:14px;line-height:1.9;overflow-wrap:anywhere}.green{color:#097d56}.red{color:#b42318}#cases{margin-top:12px}#focus{max-width:450px}.legend{font-size:13px}label{line-height:2}.stats{white-space:pre-wrap}a{color:#176bd7}
</style>
<header><h1>检测错误诊断 <small>只读 · 不改标注 · 不切换模型</small></h1><p style="margin:5px 0 0" class="muted">原图与人工框、三种策略使用同一坐标。先看证据，再判断错误原因；候选标签不等于已确认缺陷。</p></header>
<main><nav><label>查看范围<br><select id="scope"><option value="representative">典型案例</option><option value="all">全部84张</option></select></label><br><label>问题类型<br><select id="filter"><option value="all">全部类型</option></select></label><div id="cases"></div></nav>
<section><div class="tools"><button id="previous">上一例</button><button id="next">下一例</button><label>同步放大位置 <select id="focus"><option>全图</option></select></label><label><input type="checkbox" id="overlay" checked> 模型图叠加人工框</label></div><div id="notice" class="notice"></div><div class="grid" id="grid"></div><div class="details" style="margin-top:14px"><strong>判断原则</strong><p>人工框用绿色GT；匹配预测用蓝色TP；未匹配预测用红色FP；忽略区域为灰色。漏检以人工框为依据。部分框可能是漏标、位置偏差或重复，需要看原图，不能仅凭红框认定背景误检。放大视图只裁切显示，不重新推理。</p><div id="source"></div><p><a href="diagnostics.json" download>下载完整诊断JSON</a></p></div></section></main>
<script>
const DATA=__DIAGNOSTIC_DATA__;
const $=id=>document.getElementById(id),names={matched:'匹配预测',ignored:'忽略区预测',background_on_empty:'无人图误框（依人工标注）',duplicate_candidate:'重复框候选',localization_candidate:'定位/局部框偏差候选',unmatched_candidate:'未匹配预测，待看原图',miss_with_nearby_prediction:'漏检附近有预测',miss_no_nearby_prediction:'漏检附近无预测'};
let filtered=[],current=null,img=new Image(),regions=[],loading=0;
for(const [key,label] of Object.entries(names)){if(['matched','ignored'].includes(key))continue;const op=new Option(label,key);$('filter').add(op)}
function refresh(){const allowed=new Set(DATA.representativeIds);filtered=DATA.cases.filter(c=>($('scope').value==='all'||allowed.has(c.id))&&($('filter').value==='all'||c.tags.includes($('filter').value)));const list=$('cases');list.replaceChildren();filtered.forEach(c=>{const b=document.createElement('button');b.className='case'+(current?.id===c.id?' active':'');b.textContent=c.id;const info=document.createElement('small');info.textContent=`${c.entry.split==='test'?'测试':'调参'} · ${c.entry.group}`;b.append(info);b.onclick=()=>load(c);list.append(b)});if(filtered.length&&!filtered.some(c=>c.id===current?.id))load(filtered[0]);if(!filtered.length){$('notice').textContent='当前没有此类案例';$('grid').replaceChildren()}}
async function load(c){const seq=++loading;$('notice').textContent='正在读取原图…';const next=new Image();next.src=c.image;try{await next.decode();if(seq!==loading)return;img=next;current=c;regions=[];$('focus').replaceChildren(new Option('全图','-1'));c.annotation.boxes.forEach((b,i)=>regions.push({label:`人工人员GT${i+1}`,box:b}));for(const [s,d] of Object.entries(c.strategies)){d.predictions.filter(p=>p.kind!=='matched'&&p.kind!=='ignored').forEach((p,i)=>regions.push({label:`${s} · ${names[p.kind]} ${i+1}`,box:p.box}));}regions.forEach((r,i)=>$('focus').add(new Option(r.label,i)));$('notice').textContent=`${c.id} · 人工人员框 ${c.annotation.boxes.length} · ${c.tags.map(t=>names[t]).join('；')||'无计分错误'}${c.currentAnnotationMatchesSnapshot?'':' · 注意：工作台标注已变，当前展示评测快照'}`;$('source').textContent=`来源组：${c.entry.group}；原图尺寸 ${c.entry.width}×${c.entry.height}；视频时间点：${c.entry.seconds??'照片'}。${c.entry.split==='test'?'测试组':'调参组'}，不混算指标。`;refresh();draw()}catch(e){$('notice').textContent='图片读取失败：'+e.message}}
function viewport(){const index=Number($('focus').value);if(index<0||!regions[index])return [0,0,img.naturalWidth,img.naturalHeight];const b=regions[index].box,w=b[2]-b[0],h=b[3]-b[1],margin=Math.max(40,w*.65,h*.65);return [Math.max(0,b[0]-margin),Math.max(0,b[1]-margin),Math.min(img.naturalWidth,b[2]+margin),Math.min(img.naturalHeight,b[3]+margin)]}
function draw(){if(!current)return;const grid=$('grid');grid.replaceChildren();const views=[['原图','raw'],['人工复核框','truth'],['整图640','full640'],['整图1280','full1280'],['分块640','tiled640']];for(const [title,key] of views){const panel=document.createElement('article');panel.className='panel';const h=document.createElement('h2');h.textContent=title;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');const [x1,y1,x2,y2]=viewport(),w=x2-x1,hh=y2-y1;canvas.width=Math.ceil(w);canvas.height=Math.ceil(hh);ctx.drawImage(img,x1,y1,w,hh,0,0,w,hh);const line=Math.max(1.5,w/400),font=Math.max(12,w/65);function box(b,color,label,dashed=false){ctx.lineWidth=line;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.setLineDash(dashed?[line*3,line*2]:[]);ctx.strokeRect(b[0]-x1,b[1]-y1,b[2]-b[0],b[3]-b[1]);ctx.font=`${font}px sans-serif`;ctx.fillText(label,b[0]-x1+2,Math.max(font,b[1]-y1-3))}if(key==='truth'||(key!=='raw'&&$('overlay').checked)){current.annotation.boxes.forEach((b,i)=>box(b,'#0aa76c','GT'+(i+1),key!=='truth'));current.annotation.ignore.forEach(b=>box(b,'#8a98a9','IGNORE'))}const text=document.createElement('p');if(current.strategies[key]){const d=current.strategies[key];d.predictions.forEach((p,i)=>box(p.box,p.kind==='matched'?'#299bff':p.kind==='ignored'?'#8a98a9':'#ef4444',`${p.kind==='matched'?'TP':'FP'}${i+1} ${Math.round(p.box[4]*100)}%`));text.textContent=`TP ${d.tp} · 未匹配预测 ${d.fp} · 漏检 ${d.fn}`}else{text.textContent=key==='raw'?'原始派生图片，未叠加任何框':'绿色为用户已保存的评测真值快照'}panel.append(h,canvas,text);grid.append(panel)}}
$('scope').onchange=refresh;$('filter').onchange=refresh;$('focus').onchange=draw;$('overlay').onchange=draw;function move(n){const i=filtered.findIndex(c=>c.id===current?.id);if(filtered[i+n])load(filtered[i+n])}$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);refresh();
</script></html>
