spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DETECTION_DB_HOST:127.0.0.1}:${DETECTION_DB_PORT:3306}/${DETECTION_DB_NAME:station_monitoring}?characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
    username: "${DETECTION_DB_USER:rail_app}"
    password: "${DETECTION_DB_PASSWORD:}"
  mail:
    host: "${APP_MAIL_HOST:smtp.qq.com}"
    port: ${APP_MAIL_PORT:465}
    username: "${APP_MAIL_USERNAME:}"
    password: "${APP_MAIL_PASSWORD:}"
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
  redis:
    host: "${APP_REDIS_HOST:127.0.0.1}"
    port: ${APP_REDIS_PORT:6379}
    password: "${APP_REDIS_PASSWORD:}"
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB



server:
  # 端口
  url: http://localhost:8081
  port: 8081
  servlet:
    session:
      cookie:
        same-site: none

sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: sa-token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 5000000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: false
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true


mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zzy.sms.stationmonitoringbanckend.entity

# DeepSeek 密钥仅从运行环境读取，不写入源码或前端构建产物。
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-flash}

